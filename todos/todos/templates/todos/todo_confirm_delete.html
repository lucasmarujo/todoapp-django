{% extends "base.html" %}

{% block page_title %} Delete task {% endblock page_title %}

{% block content %}

<h1>Delete task</h1>
<p>Are you sure you want to delete the task <strong>{{todo.title}}</strong>?</p>

<form method="post">
    {% csrf_token %}
    <a href="{% url 'todo_list' %}" class="btn btn-primary">Cancel</a>
    <button type="submit" class="btn btn-danger">Delete</button>
</form>

{% endblock content %}
