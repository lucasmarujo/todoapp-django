{% extends "base.html" %}
{% load crispy_forms_tags %}

{% block page_title %}

  {% if todo.pk %} 
  Edit task
  {%else%}
  Create task
  {% endif %}

{% endblock %}

{% block content %}

        {% if todo.pk %} 
        <h1>Edit task</h1>
        {%else%}
        <h1>Create task</h1>
        {% endif %}

        <form method="post">
          {% csrf_token %}
          {{ form|crispy }}
          <button type="submit" class="btn btn-primary">Create</button>
        </form>

{% endblock content %}
